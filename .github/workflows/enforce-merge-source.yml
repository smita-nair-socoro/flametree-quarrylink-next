name: Enforce Branch Merge Policy
on:
  pull_request:
    branches: ["**"]   # check PRs into any target branch

jobs:
  enforce-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR source branch
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          if [[ "$TARGET" == "develop" && "$SOURCE" != "feature/QLINK-*" ]]; then
            echo "❌ Only merges from 'feature' are allowed into 'develop'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          if [[ "$TARGET" == "release" && ("$SOURCE" != "develop" || "$SOURCE" != "bugfix") ]]; then
            echo "❌ Only merges from 'develop' or 'bugfix' are allowed into 'release'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          if [[ "$TARGET" == "main" && ("$SOURCE" != "release" || "$SOURCE" != "hotfix") ]]; then
            echo "❌ Only merges from 'release' or 'hotfix' are allowed into 'main'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          echo "✅ Merge allowed: $SOURCE -> $TARGET"
