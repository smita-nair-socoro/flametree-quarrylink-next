name: Enforce Branch Merge Policy

on:
  pull_request:
    branches: ["**"]

jobs:
  enforce-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR source branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          if [[ "$TARGET" == "develop" && ! "$SOURCE" =~ ^(feature|bugfix)/[A-Z]+-[0-9]+.*$ ]]; then
            echo "❌ Only merges from 'feature/*' or 'bugfix/*' branches are allowed into 'develop'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          if [[ "$TARGET" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE" != "develop" && ! "$SOURCE" =~ ^(bugfix|hotfix)/[A-Z]+-[0-9]+.*$ ]]; then
            echo "❌ Only merges from 'develop', 'bugfix/*', or 'hotfix/*' branches are allowed into 'release/*'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          if [[ "$TARGET" == "main" && ! "$SOURCE" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ && ! "$SOURCE" =~ ^hotfix/[A-Z]+-[0-9]+.*$ ]]; then
            echo "❌ Only merges from 'release/*' or 'hotfix/*' branches are allowed into 'main'. Found: $SOURCE -> $TARGET"
            exit 1
          fi

          echo "✅ Merge allowed: $SOURCE -> $TARGET"
