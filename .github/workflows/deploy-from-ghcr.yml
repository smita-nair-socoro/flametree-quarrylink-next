name: Deploy Production Static Site from GHCR to S3 + CloudFront

on:
  workflow_run:
    workflows: ["Publish Production Image to GHCR"]
    types:
      - completed

permissions:
  contents: read
  packages: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  GHCR_REGISTRY: ghcr.io
  IMAGE_POSTFIX: oras-web

jobs:
  deploy:
    name: Deploy production static artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: static-site-production
      cancel-in-progress: false

    steps:
      - name: Validate source workflow event
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggered from workflow run ID: ${{ github.event.workflow_run.id }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag from triggering workflow
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep '^release-v[0-9]\+\.[0-9]\+\.[0-9]\+$' | head -n1 || true)

          if [ -z "$TAG" ]; then
            echo "::error ::No release-vX.Y.Z tag found on commit ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_POSTFIX_LC=$(echo "${IMAGE_POSTFIX}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')

          if [[ -n "$IMAGE_POSTFIX_LC" ]]; then
            IMAGE_REF="${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}-${IMAGE_POSTFIX_LC}"
          else
            IMAGE_REF="${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${GHCR_REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Pull production artifact from GHCR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pkg
          cd _pkg
          oras pull "${{ steps.release.outputs.image_ref }}:${{ steps.release.outputs.release_tag }}" -o .
          test -f site.tar.gz || (echo "site.tar.gz not found in artifact" && exit 1)
          ls -lah

      - name: Extract site build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          tar -xzf _pkg/site.tar.gz -C site

      - name: Generate config.json with jq
        env:
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
          COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          AMPLIFY_AUTH_REGION: ${{ vars.AMPLIFY_AUTH_REGION }}
          AMPLIFY_AUTH_USER_POOL_ID: ${{ vars.AMPLIFY_AUTH_USER_POOL_ID }}
          AMPLIFY_AUTH_USER_POOL_WEB_CLIENT_ID: ${{ vars.AMPLIFY_AUTH_USER_POOL_WEB_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          API_URL: ${{ vars.API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          jq -n \
            --arg cognitoDomain "$COGNITO_DOMAIN" \
            --arg cognitoClientId "$COGNITO_CLIENT_ID" \
            --arg cognitoRedirectUri "$COGNITO_REDIRECT_URI" \
            --arg cognitoHostedUiDomain "$COGNITO_HOSTED_UI_DOMAIN" \
            --arg amplifyAuthRegion "$AMPLIFY_AUTH_REGION" \
            --arg amplifyAuthUserPoolId "$AMPLIFY_AUTH_USER_POOL_ID" \
            --arg amplifyAuthUserPoolWebClientId "$AMPLIFY_AUTH_USER_POOL_WEB_CLIENT_ID" \
            --arg googleMapsApiKey "$GOOGLE_MAPS_API_KEY" \
            --arg apiUrl "$API_URL" \
            --arg sentryDsn "$SENTRY_DSN" \
            --arg clarityProjectId "$CLARITY_PROJECT_ID" \
            '{
               COGNITO_DOMAIN: $cognitoDomain,
               COGNITO_CLIENT_ID: $cognitoClientId,
               COGNITO_REDIRECT_URI: $cognitoRedirectUri,
               COGNITO_HOSTED_UI_DOMAIN: $cognitoHostedUiDomain,
               AMPLIFY_AUTH_REGION: $amplifyAuthRegion,
               AMPLIFY_AUTH_USER_POOL_ID: $amplifyAuthUserPoolId,
               AMPLIFY_AUTH_USER_POOL_WEB_CLIENT_ID: $amplifyAuthUserPoolWebClientId,
               GOOGLE_MAPS_API_KEY: $googleMapsApiKey,
               API_URL: $apiUrl,
               SENTRY_DSN: $sentryDsn,
               CLARITY_PROJECT_ID: $clarityProjectId
             }' > site/config.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-prod-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Empty S3 bucket
        shell: bash
        run: |
          set -euo pipefail
          aws s3 rm "s3://${{ secrets.S3_BUCKET_NAME }}" --recursive

      - name: Upload static site files
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync site/ "s3://${{ secrets.S3_BUCKET_NAME }}/" --delete

      - name: Create full CloudFront invalidation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
