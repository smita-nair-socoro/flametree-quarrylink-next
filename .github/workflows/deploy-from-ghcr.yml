# .github/workflows/deploy-from-ghcr.yml
name: Deploy from GHCR to S3+CloudFront
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OCI tag or digest (e.g., v1.3.0 or sha256:...)'
        required: true
        default: 'latest'
env:
  AWS_REGION: ap-southeast-2
permissions:
  contents: read
  packages: read      # needed to pull from GHCR
  id-token: write     # for AWS OIDC
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull artifact
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-web
          REF: ${{ github.event.inputs.version }}
        run: |
          mkdir -p pkg && cd pkg
          oras pull "$IMAGE:$REF" -o .
          ls -lah

      - name: Extract build
        run: |
          mkdir -p build
          tar -xzf pkg/site.tar.gz -C build

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Optional: deploy under a versioned prefix for easy rollbacks
      - name: Define prefix
        id: pref
        run: |
          V="${{ github.event.inputs.version }}"
          # sanitize digest to file-system friendly
          V="${V//:/-}"
          echo "prefix=releases/${V}" >> $GITHUB_OUTPUT

      - name: Sync assets (immutable)
        run: |
          aws s3 sync build "s3://${{ secrets.S3_BUCKET }}/${{ steps.pref.outputs.prefix }}" \
            --delete --cache-control "public,max-age=31536000,immutable"
          # index.html must not be hard-cached
          aws s3 cp build/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type text/html

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
