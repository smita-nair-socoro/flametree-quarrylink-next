# .github/workflows/publish-to-ghcr.yml
name: Publish Web Build to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read    # to checkout code
  packages: write   # to push to GitHub Packages/GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_POSTFIX: oras-web
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Enforce develop branch only
        if: github.ref_name != 'develop'
        run: |
          echo "This workflow can only be manually run from the 'develop' branch. You used: ${GITHUB_REF_NAME}"
          exit 1

      # Checkout code from repo
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      # Setup Bun (includes cache support)
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.22'

      # Install deps via Bun (uses bun.lockb if present)
      - run: bun install --frozen-lockfile

      # Validate your web app with Lint check
      - run: bun run lint

      # Build your web app with Bun runtime
      - run: bun run build

      # Package out/ into a tarball
      - name: Tar static output
        run: |
          tar -czf site.tar.gz -C out .

      # Install ORAS (OCI registry client)
      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      # Get current version from package.json
      - name: Install jq and read current app version
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          APP_VERSION=$(jq -r .version package.json)
          echo "CURRENT_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Current application version: $APP_VERSION"

      # Normalize image repo path to lowercase (GHCR prefers lowercase)
      # allow only [a-z0-9._-] in image postfix and lowercase it
      - name: Compute image ref
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_POSTFIX_LC=$(echo "${{ env.IMAGE_POSTFIX }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')
          if [ -n "$IMAGE_POSTFIX_LC" ]; then
            echo "IMAGE_REF=${{ env.GHCR_REGISTRY }}/${OWNER_LC}/${REPO_LC}-${IMAGE_POSTFIX_LC}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${{ env.GHCR_REGISTRY }}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          fi

      # Log in to GHCR using the provided GITHUB_TOKEN
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.GHCR_REGISTRY }} -u ${{ github.actor }} --password-stdin

      # Guard: prohibit reusing an existing version tag in GHCR
      # Requires you already ran: Log in to GHCR
      - name: Guard - version tag must be new
        if: env.CURRENT_VERSION != ''
        shell: bash
        run: |
          set -e
          TAG="${IMAGE_REF}:${CURRENT_VERSION}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "::error ::Tag already exists: $TAG. Bump your app version."
            exit 1
          fi
          echo "✅ Tag not found: $TAG"

      # Push tarball as an OCI artifact, tag == app version field from package.json
      - name: Push OCI artifact
        env:
          IMAGE: ${{ env.IMAGE_REF }}
          TAG: ${{ env.CURRENT_VERSION }}
        run: |
          oras push "$IMAGE:$TAG" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --artifact-type application/vnd.react.static+tar \
            site.tar.gz:application/gzip

      # Also push :latest tag for convenience
      - name: Tag latest
        env:
          IMAGE: ${{ env.IMAGE_REF }}
          TAG: ${{ env.CURRENT_VERSION }}
        run: |
          oras copy "$IMAGE:$TAG" "$IMAGE:latest"
