# .github/workflows/publish-to-ghcr.yml
name: Publish Web Build to GHCR

on:
  push:
    tags: ['v*.*.*']  # release by semver tags

permissions:
  contents: read    # to checkout code
  packages: write   # to push to GitHub Packages/GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_POSTFIX: oras-web
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      # Setup Bun (includes cache support)
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.22'

      # Install deps via Bun (uses bun.lockb if present)
      - run: bun install --frozen-lockfile

      # Validate your web app with Lint check
      - run: bun run lint

      # Build your web app with Bun runtime
      - run: bun run build

      # Package out/ into a tarball
      - name: Tar static output
        run: |
          tar -czf site.tar.gz -C out .

      # Install ORAS (OCI registry client)
      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      # Login to GHCR
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push tarball as an OCI artifact, tag == git tag
      - name: Push OCI artifact
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ env.IMAGE_POSTFIX }}
          TAG: ${{ github.ref_name }}
        run: |
          oras push "$IMAGE:$TAG" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --artifact-type application/vnd.react.static+tar \
            site.tar.gz:application/gzip

      # (Optional) also push :latest
      - name: Tag latest
        if: startsWith(github.ref_name, 'v')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ env.IMAGE_POSTFIX }}
          TAG: ${{ github.ref_name }}
        run: |
          oras copy "$IMAGE:$TAG" "$IMAGE:latest"
