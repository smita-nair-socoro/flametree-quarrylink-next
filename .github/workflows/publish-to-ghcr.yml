name: Publish Web Build to GHCR

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      publish_target:
        description: Select qa to force QA-style tags, or auto to derive from branch
        required: true
        default: auto
        type: choice
        options:
          - auto
          - qa

permissions:
  contents: read
  packages: write

env:
  IMAGE_POSTFIX: oras-web
  GHCR_REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Block tag refs and prod release refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "::error ::This non-prod publish workflow cannot run from a tag ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" =~ ^release-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::This non-prod publish workflow cannot publish production tags: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Tar static output
        run: tar -czf site.tar.gz -C out .

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Compute image ref
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_POSTFIX_LC=$(echo "${IMAGE_POSTFIX}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')
          if [[ -n "$IMAGE_POSTFIX_LC" ]]; then
            echo "IMAGE_REF=${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}-${IMAGE_POSTFIX_LC}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          fi

      - name: Derive non-prod tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          SAFE_BRANCH="$(echo "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')"
          PUBLISH_TARGET="${{ inputs.publish_target || 'auto' }}"

          TAGS=()

          if [[ "$PUBLISH_TARGET" == "qa" ]]; then
            TAGS+=("qa-${SHORT_SHA}")
            TAGS+=("qa-latest")
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            TAGS+=("develop-${SHORT_SHA}")
            TAGS+=("develop-latest")
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TAGS+=("main-${SHORT_SHA}")
            TAGS+=("main-latest")
          elif [[ "${GITHUB_REF_NAME}" =~ ^feature/ ]]; then
            TAGS+=("feature-${SAFE_BRANCH#feature-}-${SHORT_SHA}")
          elif [[ "${GITHUB_REF_NAME}" =~ ^bugfix/ ]]; then
            TAGS+=("bugfix-${SAFE_BRANCH#bugfix-}-${SHORT_SHA}")
          elif [[ "${GITHUB_REF_NAME}" =~ ^hotfix/ ]]; then
            TAGS+=("hotfix-${SAFE_BRANCH#hotfix-}-${SHORT_SHA}")
          else
            echo "::error ::Unsupported branch for non-prod publishing: ${GITHUB_REF_NAME}"
            exit 1
          fi

          printf 'PUBLISH_TAGS=%s\n' "$(IFS=,; echo "${TAGS[*]}")" >> "$GITHUB_ENV"
          printf 'Resolved tags: %s\n' "$(IFS=,; echo "${TAGS[*]}")"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${GHCR_REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Push OCI artifacts
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a TAGS <<< "${PUBLISH_TAGS}"
          for TAG in "${TAGS[@]}"; do
            echo "Publishing ${IMAGE_REF}:${TAG}"
            oras push "${IMAGE_REF}:${TAG}" \
              --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
              --artifact-type application/vnd.react.static+tar \
              site.tar.gz:application/gzip
          done
