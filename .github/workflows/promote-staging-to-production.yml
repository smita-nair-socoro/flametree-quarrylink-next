name: Promote Staging → Production

# Manual button (orchestrator). Prefer running this from flametree-quarrylink-next.
# 1) Promotes this frontend repo render-staging → render-production
# 2) Dispatches the same workflow on orch + fusion (needs FLAMETREE_PROMOTE_TOKEN secret)
#
# Prod Render services watch render-production (Singapore) and auto-deploy on push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type promote to confirm staging → production'
        required: true
        type: string

jobs:
  promote-this-repo:
    if: ${{ inputs.confirm == 'promote' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout render-staging
        uses: actions/checkout@v4
        with:
          ref: render-staging
          fetch-depth: 0

      - name: Push staging HEAD to render-production
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Promoting $SHA → render-production"
          git push origin "HEAD:render-production" --force-with-lease
          echo "Done. Render will auto-deploy flametree-quarrylink-next from render-production."

  promote-sibling-services:
    if: ${{ inputs.confirm == 'promote' }}
    runs-on: ubuntu-latest
    needs: promote-this-repo
    steps:
      - name: Trigger promote on orchestrator + fusion
        env:
          GH_TOKEN: ${{ secrets.FLAMETREE_PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::FLAMETREE_PROMOTE_TOKEN is not set on this repo."
            echo "Frontend was promoted. Manually run Promote Staging → Production on:"
            echo "  - smita-nair-socoro/flametree-quarrylink-service"
            echo "  - smita-nair-socoro/flametree-quarrylink-tenant-fusion-service"
            echo "Input confirm=promote"
            exit 0
          fi
          for REPO in \
            smita-nair-socoro/flametree-quarrylink-service \
            smita-nair-socoro/flametree-quarrylink-tenant-fusion-service
          do
            echo "Dispatching promote on $REPO ..."
            gh workflow run promote-staging-to-production.yml \
              --repo "$REPO" \
              --ref render-staging \
              -f confirm=promote
            echo "Dispatched $REPO"
          done

      - name: DB migration reminder
        run: |
          cat <<'EOF'
          DB migrations are NOT a Render service for Flametree.
          After promote, if schema changed, run Liquibase against prod Neon:
            - quarrylink-db-migration → quarrylink_tenant_001
            - quarrylink-tenant-fusion-db-migration → quarrylink_tenant_fusion
            - prisma db push (frontend) → quarrylink_frontend_auth
          EOF
