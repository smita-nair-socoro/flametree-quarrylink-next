# .github/workflows/publish-prod-to-ghcr.yml
name: Publish Production Web Build to GHCR

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-prod-web-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish production static artifact
    runs-on: ubuntu-latest

    env:
      IMAGE_POSTFIX: oras-web
      GHCR_REGISTRY: ghcr.io
      NODE_VERSION: "22.19.0"
      BUN_VERSION: "1.2.22"

    steps:
      - name: Enforce production release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error ::Production publish must run from release/X.Y.Z or release/X.Y.Z.W. Current branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build static site
        run: bun run build

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Read and validate app version
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq

          APP_VERSION="$(jq -r .version package.json)"
          BRANCH_VERSION="${GITHUB_REF_NAME#release/}"

          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "null" ]]; then
            echo "::error ::package.json version is missing."
            exit 1
          fi

          if [[ "$APP_VERSION" != "$BRANCH_VERSION" ]]; then
            echo "::error ::package.json version ($APP_VERSION) must match release branch version ($BRANCH_VERSION)."
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "PROD_TAG=release-v$APP_VERSION" >> "$GITHUB_ENV"
          echo "Production tag: release-v$APP_VERSION"

      - name: Compute image ref
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_POSTFIX_LC="$(echo '${{ env.IMAGE_POSTFIX }}' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"

          if [ -n "$IMAGE_POSTFIX_LC" ]; then
            echo "IMAGE_REF=${{ env.GHCR_REGISTRY }}/${OWNER_LC}/${REPO_LC}-${IMAGE_POSTFIX_LC}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${{ env.GHCR_REGISTRY }}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.GHCR_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package static output
        run: |
          set -euo pipefail
          test -d out || (echo "::error ::out/ was not produced by the build" && exit 1)
          tar -czf site.tar.gz -C out .
          ls -lah site.tar.gz

      - name: Guard - production tag must be new
        shell: bash
        run: |
          set -euo pipefail
          TAG="${IMAGE_REF}:${PROD_TAG}"
          if oras manifest fetch "$TAG" > /dev/null 2>&1; then
            echo "::error ::Tag already exists: $TAG. Create a new release version instead of overwriting prod artifacts."
            exit 1
          fi
          echo "Tag is available: $TAG"

      - name: Push production OCI artifact
        env:
          IMAGE: ${{ env.IMAGE_REF }}
          TAG: ${{ env.PROD_TAG }}
        run: |
          set -euo pipefail
          oras push "$IMAGE:$TAG" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.version=${{ env.APP_VERSION }}" \
            --artifact-type application/vnd.react.static+tar \
            site.tar.gz:application/gzip

      - name: Tag latest-prod
        env:
          IMAGE: ${{ env.IMAGE_REF }}
          TAG: ${{ env.PROD_TAG }}
        run: |
          set -euo pipefail
          oras copy "$IMAGE:$TAG" "$IMAGE:latest-prod"
