name: Publish Production Image to GHCR

on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_POSTFIX: oras-web
  GHCR_REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish production static artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^release-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid release tag format: $TAG"
            echo "Expected format: release-vX.Y.Z"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Tar static output
        run: tar -czf site.tar.gz -C out .

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Compute image ref
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_POSTFIX_LC=$(echo "${IMAGE_POSTFIX}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')

          if [[ -n "$IMAGE_POSTFIX_LC" ]]; then
            echo "IMAGE_REF=${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}-${IMAGE_POSTFIX_LC}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${GHCR_REGISTRY}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          fi

          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#release-v}" >> "$GITHUB_ENV"
          echo "FULL_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${GHCR_REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Guard - release tag must be new in GHCR
        shell: bash
        run: |
          set -euo pipefail

          if oras manifest fetch "${IMAGE_REF}:${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error ::Tag already exists: ${IMAGE_REF}:${RELEASE_TAG}"
            exit 1
          fi

          if oras manifest fetch "${IMAGE_REF}:${RELEASE_VERSION}" > /dev/null 2>&1; then
            echo "::error ::Tag already exists: ${IMAGE_REF}:${RELEASE_VERSION}"
            exit 1
          fi

      - name: Push production OCI artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAGS=(
            "${RELEASE_TAG}"
            "${RELEASE_VERSION}"
            "sha-${FULL_SHA}"
          )

          for TAG in "${TAGS[@]}"; do
            echo "Publishing ${IMAGE_REF}:${TAG}"
            oras push "${IMAGE_REF}:${TAG}" \
              --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
              --annotation "org.opencontainers.image.version=${RELEASE_VERSION}" \
              --artifact-type application/vnd.react.static+tar \
              site.tar.gz:application/gzip
          done
