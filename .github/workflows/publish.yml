# .github/workflows/publish.yml
name: Publish Web Build to GHCR
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Bun
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Install & build
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Tar the build
      - name: Tar build
        run: tar -czf site.tar.gz -C build .

      # Upload artifact (optional, for debugging)
      - uses: actions/upload-artifact@v4
        with:
          name: site-tar
          path: site.tar.gz
          retention-days: 3

      # ORAS client
      - uses: oras-project/setup-oras@v1

      # Lowercase image path
      - name: Compute image ref
        id: img
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/${REPO_LC}-web" >> "$GITHUB_OUTPUT"

      # Login GHCR
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push OCI artifact
      - name: Push OCI artifact
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          TAG: ${{ github.ref_name }}
          REV: ${{ github.sha }}
        run: |
          oras push "${IMAGE}:${TAG}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.title=${{ github.event.repository.name }}-web" \
            --annotation "org.opencontainers.image.version=${TAG}" \
            --annotation "org.opencontainers.image.revision=${REV}" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --artifact-type application/vnd.react.static+tar \
            site.tar.gz:application/gzip

      # Tag latest
      - name: Tag latest
        if: startsWith(github.ref_name, 'v')
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: oras copy "${IMAGE}:${TAG}" "${IMAGE}:latest"
